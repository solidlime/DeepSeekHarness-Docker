packages:
  - .

# pnpm の isolated 配置だと dsh-web-all の一部子パッケージが
# "Cannot find package '@linxin666/dsh-...'" になるので hoisted にする。
nodeLinker: hoisted
autoInstallPeers: false

# dsh-web-all が依存する native ビルドを許可する。add の前に必要。
allowBuilds:
  - cloudflared
  - cpu-features
  - ssh2

# pnpm 11 以降の minimumReleaseAge で古い版に巻き戻されるのを防ぐ。
minimumReleaseAgeExclude:
  - '@linxin666/*'
