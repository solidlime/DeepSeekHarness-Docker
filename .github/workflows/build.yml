name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # 週 1 回、dsh の新リリースを取り込む。月曜 03:00 JST（日曜 18:00 UTC）。
  # 手で回すときは workflow_dispatch。
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/solidlime/deepseek-harness-container

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha }}
        run: |
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-$SHA_TAG" \
            .

      # buildx は使わない。buildx の既定ドライバではビルド結果がローカル
      # daemon のイメージ一覧に入らないため、直後の smoke test で
      # docker run できない。ローカル daemon に載せて確実に叩く。
      - name: Smoke test
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha }}
        run: |
          set -eu
          docker run --rm -i \
            --entrypoint sh \
            "$IMAGE:sha-$SHA_TAG" -s <<'SH'
          set -eu

          echo "== イメージに dsh を焼いていない =="
          # dsh は起動時に永続ボリュームへ入れる設計。イメージに node_modules が
          # 残っていたら pull が遅くなるので、ここで退行を止める。
          ! command -v dsh
          test ! -d /opt/dsh/node_modules

          echo "== bootstrap.js の自己検証 =="
          # トークン抽出・cookie 生成・Caddyfile 書き換えを実物のコードで確認する。
          DSH_BOOTSTRAP_SELFTEST=1 node /usr/local/bin/bootstrap.js

          echo "== Caddyfile の種 =="
          test -f /etc/caddy/Caddyfile.dsh
          grep -q 'header_up Host {http.request.hostport}' \
            /etc/caddy/Caddyfile.dsh

          echo "== entrypoint syntax =="
          sh -n /usr/local/bin/docker-entrypoint.sh

          echo "== entrypoint exec bit =="
          perm=$(stat -c %a /usr/local/bin/docker-entrypoint.sh)
          echo "mode=$perm"
          case "$perm" in
            *1|*3|*5|*7) ;;
            *) echo "not executable: $perm" >&2; exit 1 ;;
          esac

          echo "== credentials.yaml chmod + refs 登録 =="
          # bind mount は umask 0022 で 755 になる。entrypoint の実物を
          # 実行して、chmod と DSH_LITELLM_KEY の refs 登録を確かめる。
          mkdir -p "$DSH_HOME"
          printf 'version: 1\n' > "$DSH_HOME/.credentials.yaml"
          chmod 755 "$DSH_HOME/.credentials.yaml"
          # --dry-run 相当は無いので、entrypoint から該当ブロックを抜いて
          # 本物のスクリプトとして実行する。
          sed -n '/^CRED="\$DSH_HOME/,/^fi$/p' \
            /usr/local/bin/docker-entrypoint.sh > /tmp/cred-block.sh
          test -s /tmp/cred-block.sh
          DSH_HOME="$DSH_HOME" DSH_LITELLM_KEY=sk-test-1234 \
            sh /tmp/cred-block.sh
          test "$(stat -c %a "$DSH_HOME/.credentials.yaml")" = "600"
          grep -q '^  DSH_LITELLM_KEY: sk-test-1234$' \
            "$DSH_HOME/.credentials.yaml"
          # 冪等: 2 回目でも 1 行のまま
          DSH_HOME="$DSH_HOME" DSH_LITELLM_KEY=sk-test-1234 \
            sh /tmp/cred-block.sh
          n=$(grep -c 'DSH_LITELLM_KEY' "$DSH_HOME/.credentials.yaml")
          test "$n" = "1"
          # 既存 refs: へ追記する形も壊れていないこと
          printf 'version: 1\nrefs:\n  OTHER: x\n' \
            > "$DSH_HOME/.credentials.yaml"
          DSH_HOME="$DSH_HOME" DSH_LITELLM_KEY=sk-test-1234 \
            sh /tmp/cred-block.sh
          grep -q '^  OTHER: x$' "$DSH_HOME/.credentials.yaml"
          grep -q '^  DSH_LITELLM_KEY: sk-test-1234$' \
            "$DSH_HOME/.credentials.yaml"
          echo "mode=$(stat -c %a "$DSH_HOME/.credentials.yaml")"

          echo "smoke test passed"
          SH

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha }}
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$SHA_TAG"

      # GHCR のパッケージ可視性はリポジトリと別管理。private のままだと
      # Portainer が匿名 pull できず NAS の compose pull が 403 になる。
      - name: Make package public
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          api=https://api.github.com/user/packages/container
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"visibility":"public"}' \
            "$api/deepseek-harness-container" \
            | head -c 400
