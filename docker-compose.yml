services:
  dsh:
    image: ghcr.io/solidlime/deepseek-harness-container:latest
    # :latest は Portainer の再デプロイで pull されないことがある（実際に踏んだ。
    # イメージの created が更新されず、古い CSS のまま動き続けた）。
    # 毎回 registry を見に行かせる。
    pull_policy: always
    container_name: dsh
    hostname: dsh
    restart: unless-stopped
    # dsh からホスト上の LiteLLM へは固定 IP でなく host-gateway で行く。
    # Docker の bridge サブネットはネットワーク再作成で変わるため、
    # 192.168.x.1 直書きだと再起動後に突然タイムアウトする（実際に踏んだ）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3080:3080"
    volumes:
      # /root まるごと永続化する。DSH_HOME (=/root/.dsh) と
      # .credentials.yaml、クッキー署名用 secret がまとめて残り、
      # 再起動後も初回ログインのクッキーが有効なままになる。
      - /volume1/docker/dsh/root:/root
    environment:
      TZ: Asia/Tokyo
      # モバイル修正 CSS の URL に焼く。上流でレイアウトが直ったら
      # を空にするとリンクごと消える。
      DSH_MOBILE_FIX: ${DSH_MOBILE_FIX:-1}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-nas:3080}
      # dsh 本体はイメージに入っていない。初回起動時に $DSH_HOME/runtime へ
      # npm install し、以降は永続ボリュームのそれを使い回す。
      # 手元の dsh を最新にしたいときだけ 1 を入れて作り直す（数分かかる）。
      DSH_RUNTIME_REFRESH: ${DSH_RUNTIME_REFRESH:-0}
      # dsh のモデルは LiteLLM ゲートウェイに相乗りする（モデル名は
      # cordis.patch.yml の llm-pi-ai ルートで定義済み）。
      # host.docker.internal は上の extra_hosts でホスト自身を指す。
      # ホスト側のポートが違う環境では .env で上書きする。
      DSH_LITELLM_URL: ${DSH_LITELLM_URL:-http://host.docker.internal:4000/v1}
      # マスターキーはここで渡さない。
      # 以前は ${DSH_LITELLM_KEY:-} で受けて entrypoint が .credentials.yaml に
      # 書き込んでいたが、Portainer が未設定の変数を空でなく崩れた値にして渡す
      # ことがあり、その値が refs: を上書きして LiteLLM が 401 になった。
      # キーは永続ボリュームの /root/.dsh/.credentials.yaml の refs: に直接置く。
    healthcheck:
      # dsh は 127.0.0.1 bind なので、コンテナ内から Caddy 経由で叩く。
      # cookie 注入前は 401、注入後は 200。どちらも「待ち受けている」証拠なので
      # 3xx/401 も正常扱いにする（unhealthy のちらつきを避ける）。
      # 注入の成否は docker logs の "bootstrap: injected" で確認する。
      test:
        - CMD-SHELL
        - >-
          test "$(curl -sS -o /dev/null -w '%{http_code}'
          -H "Host: ${DSH_TRUSTED_HOST}"
          http://127.0.0.1:3080/ || echo 000)" != "000"
      interval: 30s
      timeout: 5s
      retries: 3
      # 初回起動は npm install が走るので長めに取る（2回目以降は数秒）。
      start_period: 600s
